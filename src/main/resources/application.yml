server:
  port: 8080

spring:
  application:
    name: pet-service

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

photo:
  max-file-size: 10485760
  connection-timeout: 5000
  read-timeout: 10000

minio:
  url: ${MINIO_URL}
  user: ${MINIO_USER}
  password: ${MINIO_PASS}
  bucket: pet-service-files
  bucket-policy: public-read

springdoc:
  swagger-ui:
    url: /pet-service-api.yaml
