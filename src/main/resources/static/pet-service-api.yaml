openapi: "3.1.0"
info:
  title: Pet Service API
  description: >
    Сервис управления питомцами. Код контроллера генерируется из данной спецификации
    с помощью openapi-generator-gradle-plugin. Разработчик реализует только PetApiDelegate.
  version: "1.0.0"
  contact:
    email: dev@example.com

servers:
  - url: http://localhost:8081/api/v1
    description: Local development

tags:
  - name: pet
    description: Операции с питомцами

paths:

  /pet:
    post:
      tags: [pet]
      summary: Добавить нового питомца
      operationId: addPet
      requestBody:
        description: Данные нового питомца
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
      responses:
        '200':
          description: Питомец успешно добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [pet]
      summary: Обновить существующего питомца
      operationId: updatePet
      requestBody:
        description: Обновлённые данные питомца (id обязателен)
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
      responses:
        '200':
          description: Питомец успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '404':
          description: Питомец не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Найти питомцев по статусу
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          required: true
          description: Статус питомца для фильтрации
          schema:
            type: string
            enum: [available, pending, sold]
            default: available
      responses:
        '200':
          description: Список питомцев с указанным статусом
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetResponse'
        '400':
          description: Неверное значение статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pet/findByTags:
    get:
      tags: [pet]
      summary: Найти питомцев по тегам
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          required: true
          description: Список тегов для фильтрации
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Список питомцев с указанными тегами
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetResponse'
        '400':
          description: Неверное значение тега
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pet/{petId}:
    get:
      tags: [pet]
      summary: Получить питомца по ID
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          description: ID питомца
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Данные питомца
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          description: Неверный ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Питомец не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [pet]
      summary: Обновить имя или статус питомца
      operationId: updatePetWithForm
      parameters:
        - name: petId
          in: path
          required: true
          description: ID питомца
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          required: false
          description: Новое имя питомца
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Новый статус питомца
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        '200':
          description: Питомец обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          description: Неверные входные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Питомец не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [pet]
      summary: Удалить питомца
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          description: ID питомца
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Питомец удалён
        '400':
          description: Неверный ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Питомец не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pet/{petId}/uploadImage:
    post:
      tags: [ pet ]
      summary: Загрузить фото питомца
      operationId: uploadFile
      parameters:
        - name: petId
          in: path
          required: true
          description: ID питомца
          schema:
            type: integer
            format: int64
        - name: additionalMetadata
          in: query
          required: false
          description: Дополнительные метаданные
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл изображения питомца
      responses:
        '200':
          description: Файл успешно загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Файл не передан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Питомец не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:

    PetRequest:
      type: object
      required: [name, photoUrls]
      description: DTO для создания и обновления питомца
      properties:
        id:
          type: integer
          format: int64
          description: ID питомца (обязателен при обновлении)
          example: 1
        name:
          type: string
          description: Имя питомца
          example: Барсик
        category:
          $ref: '#/components/schemas/CategoryDto'
        photoUrls:
          type: array
          description: Список URL фотографий
          items:
            type: string
        tags:
          type: array
          description: Список тегов
          items:
            $ref: '#/components/schemas/TagDto'
        status:
          type: string
          description: Статус питомца
          enum: [available, pending, sold]
          default: available

    PetResponse:
      type: object
      description: DTO ответа с данными питомца
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Барсик
        category:
          $ref: '#/components/schemas/CategoryDto'
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
        status:
          type: string
          enum: [available, pending, sold]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryDto:
      type: object
      description: Категория питомца
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Кошки

    TagDto:
      type: object
      description: Тег питомца
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: пушистый

    ApiResponse:
      type: object
      description: Ответ на загрузку файла
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      description: Стандартный ответ об ошибке
      properties:
        code:
          type: string
          example: PET_NOT_FOUND
        message:
          type: string
          example: Питомец с ID 42 не найден
        timestamp:
          type: string
          format: date-time
